type: object
description: Order summary returned by the search endpoint.
required:
  - orderRef
  - channel
  - orderStatus
  - storeName
  - items
properties:
  orderRef:
    type: string
    description: Order reference.
    example: ORD-2026-1042
  channel:
    type: string
    description: Channel through which the order was placed.
    example: WEB
  orderStatus:
    type: string
    description: Current order status. This field can be searched.
    example: EN PROCESO
  storeName:
    type: string
    description: Store associated with the order. This field can be searched.
    example: Liverpool Centro
  items:
    type: array
    description: Items returned with the search result.
    items:
      $ref: ./item.yaml
