type: object
description: Item information included in an order search result.
required:
  - itemId
  - quantity
  - displayName
properties:
  itemId:
    type: string
    description: Identifier of the item in the order.
    example: ITEM-781
  quantity:
    type: integer
    description: Number of units ordered.
    example: 1
  displayName:
    type: string
    description: Product name shown to the customer.
    example: Audífonos inalámbricos
