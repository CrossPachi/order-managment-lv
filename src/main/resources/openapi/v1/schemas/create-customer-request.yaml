type: object
description: Details required to create a customer. `userId` is optional; the service generates a UUID when it is blank or omitted.
example:
  userId: customer-123
  name: Ana
  fathersLastName: Pérez
  mothersLastName: Gómez
  email: ana@example.com
  address: Avenida Reforma 100
required:
  - name
  - fathersLastName
  - mothersLastName
  - email
  - address
properties:
  userId:
    type: string
    maxLength: 50
    description: Optional customer ID. When omitted or blank, a UUID is generated.
    example: customer-123
  name:
    type: string
    minLength: 2
    maxLength: 50
    pattern: '^[\p{L} ]+$'
    description: Customer's first name, made up of letters and spaces.
    example: Ana
  fathersLastName:
    type: string
    minLength: 2
    maxLength: 50
    pattern: '^[\p{L} ]+$'
    description: Customer's father's last name, made up of letters and spaces.
    example: Pérez
  mothersLastName:
    type: string
    minLength: 2
    maxLength: 50
    pattern: '^[\p{L} ]+$'
    description: Customer's mother's last name, made up of letters and spaces.
    example: Gómez
  email:
    type: string
    format: email
    maxLength: 50
    description: Customer's email address.
    example: ana@example.com
  address:
    type: string
    minLength: 5
    maxLength: 200
    description: Customer's address.
    example: Avenida Reforma 100
