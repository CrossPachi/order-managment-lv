get:
  tags:
    - Customers
  summary: Get a customer by ID
  description: Retrieves one customer by ID and includes the references of any orders associated with them.
  operationId: getCustomerById
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/customerId
  responses:
    '200':
      description: Customer and order references returned.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/CustomerWithOrdersResponse
          example:
            userId: customer-123
            name: Ana
            fathersLastName: Pérez
            mothersLastName: Gómez
            email: ana@example.com
            address: Avenida Reforma 100
            orders:
              - ORD-2026-1042
    '400':
      description: The customer ID does not match the required format.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ApiError
          example:
            status: 400
            error: Bad Request
            message: 'getCustomerById.customerId: CustomerId invalid format'
            timestamp: '2026-10-14T19:30:00Z'
    '404':
      description: No customer exists with the supplied ID.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ApiError
          example:
            status: 404
            error: Not Found
            message: 'Customer not found: customer-123'
            timestamp: '2026-10-14T19:30:00Z'
    '502':
      description: The order service could not be reached while loading the customer's orders.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ApiError
          example:
            status: 502
            error: Bad Gateway
            message: Unable to load orders from external services
            timestamp: '2026-10-14T19:30:00Z'
    '500':
      description: An unexpected server-side problem occurred while retrieving the customer.

put:
  tags:
    - Customers
  summary: Replace a customer's details
  description: Replaces all editable customer details. Every field in the request body is required; use PATCH to change only selected fields.
  operationId: updateCustomer
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/customerId
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/UpdateCustomerRequest
        examples:
          replaceCustomerDetails:
            summary: Replace all customer details
            value:
              name: Ana
              fathersLastName: Pérez
              mothersLastName: Gómez
              email: ana@example.com
              address: Avenida Reforma 100
  responses:
    '200':
      description: Customer updated.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/CustomerResponse
          example:
            userId: customer-123
            name: Ana
            fathersLastName: Pérez
            mothersLastName: Gómez
            email: ana@example.com
            address: Avenida Reforma 100
    '400':
      description: The customer ID or request body is invalid.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ApiError
          example:
            status: 400
            error: Bad Request
            message: 'name: Name is required'
            timestamp: '2026-10-14T19:30:00Z'
    '404':
      description: No customer exists with the supplied ID.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ApiError
          example:
            status: 404
            error: Not Found
            message: 'Customer not found: customer-123'
            timestamp: '2026-10-14T19:30:00Z'
    '500':
      description: An unexpected server-side problem occurred while updating the customer.

patch:
  tags:
    - Customers
  summary: Update selected customer details
  description: |
    Changes only the fields included in the request. Fields that are omitted or
    null keep their current values. At least one field must be provided. Use
    PUT when replacing all editable details.

    Example request:

    ```bash
    curl --request PATCH 'http://localhost:8080/api/v1/customers/customer-123' \
      --header 'Content-Type: application/json' \
      --data '{"email":"ana.nueva@example.com"}'
    ```
  operationId: patchCustomer
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/customerId
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/PatchCustomerRequest
        examples:
          updateEmail:
            summary: Change only the email address
            value:
              email: ana.nueva@example.com
          updateNameAndAddress:
            summary: Change more than one field
            value:
              name: Ana María
              address: Avenida Reforma 200
  responses:
    '200':
      description: Customer updated. Fields omitted from the request keep their existing values.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/CustomerResponse
          example:
            userId: customer-123
            name: Ana
            fathersLastName: Pérez
            mothersLastName: Gómez
            email: ana.nueva@example.com
            address: Avenida Reforma 100
    '400':
      description: The customer ID or a provided field is invalid, or no fields were provided.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ApiError
          examples:
            invalidField:
              summary: A field does not meet its validation rules
              value:
                status: 400
                error: Bad Request
                message: 'email: Email format is invalid'
                timestamp: '2026-10-14T19:30:00Z'
            emptyPatch:
              summary: The patch has no fields to update
              value:
                status: 400
                error: Bad Request
                message: A field must be provided to update the customer
                timestamp: '2026-10-14T19:30:00Z'
            invalidCustomerId:
              summary: Customer ID has an invalid format
              value:
                status: 400
                error: Bad Request
                message: 'patchCustomer.customerId: CustomerId invalid format'
                timestamp: '2026-10-14T19:30:00Z'
    '404':
      description: No customer exists with the supplied ID.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ApiError
          example:
            status: 404
            error: Not Found
            message: 'Customer not found: customer-123'
            timestamp: '2026-10-14T19:30:00Z'
    '500':
      description: An unexpected server-side problem occurred while updating the customer.

delete:
  tags:
    - Customers
  summary: Delete a customer
  description: Permanently removes the customer with the supplied ID. A successful deletion returns no response body.
  operationId: deleteCustomer
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/customerId
  responses:
    '204':
      description: Customer deleted. The response has no body.
    '400':
      description: The customer ID does not match the required format.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ApiError
          example:
            status: 400
            error: Bad Request
            message: 'deleteCustomer.customerId: CustomerId invalid format'
            timestamp: '2026-10-14T19:30:00Z'
    '404':
      description: No customer exists with the supplied ID.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ApiError
          example:
            status: 404
            error: Not Found
            message: 'Customer not found: customer-123'
            timestamp: '2026-10-14T19:30:00Z'
    '500':
      description: An unexpected server-side problem occurred while deleting the customer.
