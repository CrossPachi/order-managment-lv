get:
  tags:
    - Customers
  summary: Get all customers
  description: Returns every registered customer with the references of their orders. An empty list is returned when there are no customers.
  operationId: getAllCustomers
  responses:
    '200':
      description: Customer list returned. The list may be empty.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../openapi.yaml#/components/schemas/CustomerWithOrdersResponse
          examples:
            customersFound:
              summary: Customers with their order references
              value:
                - userId: customer-123
                  name: Ana
                  fathersLastName: Pérez
                  mothersLastName: Gómez
                  email: ana@example.com
                  address: Avenida Reforma 100
                  orders:
                    - ORD-2026-1042
            noCustomers:
              summary: No customers are registered
              value: []
    '502':
      description: The order service could not be reached while loading customer orders.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ApiError
          example:
            status: 502
            error: Bad Gateway
            message: Unable to load orders from external services
            timestamp: '2026-10-14T20:30:00Z'
    '500':
      description: An unexpected server-side problem occurred while retrieving customers.

post:
  tags:
    - Customers
  summary: Create a customer
  description: |
    Adds a customer record and returns the saved details. `userId` is optional
    and can contain up to 50 characters. If it is omitted or blank, the service
    generates an ID. The email address must be valid and the name fields must
    contain letters and spaces.

    Example request:

    ```bash
    curl --request POST 'http://localhost:8080/api/v1/customers' \
      --header 'Content-Type: application/json' \
      --data '{
        "userId": "customer-123",
        "name": "Ana",
        "fathersLastName": "Pérez",
        "mothersLastName": "Gómez",
        "email": "ana@example.com",
        "address": "Avenida Reforma 100"
      }'
    ```
  operationId: createCustomer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/CreateCustomerRequest
        examples:
          newCustomer:
            summary: Create Ana Pérez Gómez
            value:
              userId: customer-123
              name: Ana
              fathersLastName: Pérez
              mothersLastName: Gómez
              email: ana@example.com
              address: Avenida Reforma 100
  responses:
    '201':
      description: Customer created.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/CustomerResponse
          example:
            userId: customer-123
            name: Ana
            fathersLastName: Pérez
            mothersLastName: Gómez
            email: ana@example.com
            address: Avenida Reforma 100
    '400':
      description: The request body is invalid.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ApiError
          example:
            status: 400
            error: Bad Request
            message: 'email: Email format is invalid'
            timestamp: '2026-10-14T19:30:00Z'
    '409':
      description: A customer with the supplied user ID already exists.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ApiError
          example:
            status: 409
            error: Conflict
            message: 'Customer: customer-123 already exists.'
            timestamp: '2026-10-14T19:30:00Z'
    '500':
      description: An unexpected server-side problem occurred while creating the customer.
