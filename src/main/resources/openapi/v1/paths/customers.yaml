post:
  tags:
    - Customers
  summary: Create a customer
  description: |
    Creates a customer record. You may provide a `userId` up to 50 characters.
    If it is omitted, null, or blank, the service generates a UUID.

    Example request:

    ```bash
    curl --request POST 'http://localhost:8080/api/v1/customers' \
      --header 'Content-Type: application/json' \
      --data '{
        "userId": "customer-123",
        "name": "Ana",
        "fathersLastName": "Pérez",
        "mothersLastName": "Gómez",
        "email": "ana@example.com",
        "address": "Avenida Reforma 100"
      }'
    ```
  operationId: createCustomer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/CreateCustomerRequest
        example:
          userId: customer-123
          name: Ana
          fathersLastName: Pérez
          mothersLastName: Gómez
          email: ana@example.com
          address: Avenida Reforma 100
  responses:
    '201':
      description: Customer created.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/CustomerResponse
          example:
            userId: customer-123
            name: Ana
            fathersLastName: Pérez
            mothersLastName: Gómez
            email: ana@example.com
            address: Avenida Reforma 100
    '400':
      description: The request body is invalid.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ApiError
          example:
            status: 400
            error: Bad Request
            message: 'email: Email format is invalid'
            timestamp: '2026-10-14T19:30:00Z'
    '409':
      description: A customer with the supplied user ID already exists.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ApiError
          example:
            status: 409
            error: Conflict
            message: 'Customer: customer-123 already exists.'
            timestamp: '2026-10-14T19:30:00Z'
    '500':
      description: An unexpected problem occurred while creating the customer.
