get:
  tags:
    - Orders
  summary: Search orders
  description: |
    Finds orders by order reference, status, store name, or product name.

    Enter a word or phrase in `text`. Matching ignores letter case, accents,
    and punctuation such as commas. Store and product names also allow a minor
    spelling mistake (up to one character difference in a word). The search
    supports partial text, so it can be used as the user types. For example,
    searching for `audifonos inalambricos` can find an item named
    `Audífonos inalámbricos`.

    Example request:

    ```bash
    curl --get 'http://localhost:8080/api/v1/orders/search' \
      --data-urlencode 'text=audifonos inalambricos'
    ```

  operationId: searchOrders
  parameters:
    - name: text
      in: query
      required: true
      description: Word or phrase to search for as the user types.
      schema:
        type: string
      example: audifonos inalambricos
  responses:
    '200':
      description: Search completed. The list is empty when there are no matches or the search text is blank.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../openapi.yaml#/components/schemas/OrderSearchResponse
          examples:
            matchingOrder:
              summary: An order with a matching item name
              value:
                - orderRef: ORD-2026-1042
                  channel: WEB
                  orderStatus: EN PROCESO
                  storeName: Liverpool Centro
                  items:
                    - itemId: ITEM-781
                      quantity: 1
                      displayName: Audífonos inalámbricos
            noMatches:
              summary: No matching orders
              value: []
    '400':
      description: The required `text` query parameter was not provided. An empty or blank value returns a successful response with no matches.
    '502':
      description: The order or item service could not be reached, or returned an empty response.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ApiError
          example:
            status: 502
            error: Bad Gateway
            message: Unable to load orders from external services
            timestamp: '2026-10-12T22:30:00Z'
    '500':
      description: An unexpected server-side problem occurred while searching orders.
